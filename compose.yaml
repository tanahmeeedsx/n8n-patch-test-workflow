services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-staging-postgres
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_staging_pw
      POSTGRES_DB: n8n
    volumes:
      - n8n-staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.7
    container_name: n8n-staging-app
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_staging_pw
      DB_POSTGRESDB_DATABASE: n8n
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-staging-data:/home/node/.n8n

volumes:
  n8n-staging-db:
  n8n-staging-data:
